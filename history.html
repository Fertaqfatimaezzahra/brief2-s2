<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECE - History</title>
    <link rel="stylesheet" href="./src/output.css">
</head>
<body class = "min-h-screen bg-slate-950 text-white">
    <header class = "w-full bg-slate-900 border-b border-slate-800">
    <div class="mx-auto max-w-7xl px-4 py-4 flex flex-wrap items-center justify-between gap-3">
        <a href="index.html" class ="flex items-center gap-2 font-bold text-amber-400">
      <span>👑</span><span>ECE</span>
      </a>
      <nav class="flex flex-wrap gap-6 sm:gap-16">
      <a href="index.html" class="text-slate-300 hover:text-amber-400 transition">Home</a>
      <a href="game.html" class="text-slate-300 hover:text-amber-400 transition">Game</a>
      <a href="history.html" class="font-semibold text-amber-400" aria-current="page">History</a>
    </nav>
      <p class="w-full sm:w-auto text-sm text-slate-400">Player: <span id="current-player" class="font-semibold text-white">No player selected</span></p>
    </div>
    </header>

    <main class="mx-auto max-w-7xl px-4 py-6 space-y-6">
        <h1 class="text-2xl font-bold text-amber-400">Games history</h1>

        <!-- recherche + filtres -->
        <div class="bg-slate-900 rounded-xl p-4 sm:p-6 grid gap-4 sm:grid-cols-3">
            <div class="space-y-1">
                <label for="search" class="block text-sm text-slate-300">Search by nickname</label>
                <input type="search" id="search" placeholder="e.g. Yanis_07"
                class="block w-full rounded-lg border border-slate-600 bg-slate-950 p-3 text-white placeholder:text-slate-500 hover:border-slate-400 focus:outline-none focus:ring-2 focus:ring-amber-400 focus:border-amber-400 transition">
            </div>
            <div class="space-y-1">
                <label for="result-filter" class="block text-sm text-slate-300">Result</label>
                <select id="result-filter"
                class="block w-full rounded-lg border border-slate-600 bg-slate-950 p-3 text-white hover:border-slate-400 focus:outline-none focus:ring-2 focus:ring-amber-400 transition">
                    <option value="all">All</option>
                    <option value="victoire">Victoires</option>
                    <option value="défaite">Défaites</option>
                    <option value="égalité">Égalités</option>
                </select>
            </div>
            <div class="space-y-1">
                <label for="period-filter" class="block text-sm text-slate-300">Date</label>
                <select id="period-filter"
                class="block w-full rounded-lg border border-slate-600 bg-slate-950 p-3 text-white hover:border-slate-400 focus:outline-none focus:ring-2 focus:ring-amber-400 transition">
                    <option value="all">All time</option>
                    <option value="today">Today</option>
                    <option value="week">Last 7 days</option>
                </select>
            </div>
        </div>

        <p id="history-count" class="text-sm text-slate-400"></p>
        <div id="history-list" class="space-y-3"></div>
        <p id="history-empty" class="hidden rounded-xl border border-dashed border-slate-700 p-6 text-center text-slate-400"></p>
    </main>
    <script type="module" src="./src/main.js"></script>
</body>
</html>
