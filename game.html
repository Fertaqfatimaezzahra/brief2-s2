<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECE-profils</title>
    <link rel="stylesheet" href="./src/output.css">
</head>
<body class = "min-h-screen bg-slate-950 text-white">
   
    <main>
      <!-- gamesection -->
       <section id="game" class="bg-slate-900 rounded-xl p-4 mt-6 space-y-4">
         <h2 class="text-amber-400">Game Arena</h2>
         <p id="round">Round: 1 / 12</p>
         <p id="camp">Camp: Empereur</p>
         <p id="score">Player: 0 | Computer: 0</p>
         <label for="selected-player">Choose player</label>
         <select id="selected-player" class="w-full rounded-lg bg-slate-800 text-white">
            <option valur="">Select a player</option>
         </select>
         <button id="start-game" class="bg-amber-400 text-slate-950 p-4 rounded-lg">
            Start game
         </button>
         <!-- computercards -->
         <h3 class="text-center text-amber-400"> Computer Cards</h3>
          <div id="computer-cards" 
          class="grid grid-cols-5 gap-1 sm:gap-3 max-w-2xl mx-auto">


          </div>
    <!-- duel arena -->
     <div class="grid grid-cols-2 gap-4 my-8">
    <div id="player-played-card"
         class="min-h-32 rounded-xl border border-amber-400/40 bg-slate-800 flex items-center justify-center text-amber-400">
        Your Card
    </div>

    <div id="computer-played-card"
         class="min-h-32 rounded-xl border border-amber-400/40 bg-slate-800 flex items-center justify-center text-amber-400">
        Computer Card
    </div>
</div>

 <!-- playercards -->
         <h3 class="text-center text-amber-400"> Your Cards</h3>
          <div id="player-cards" 
          class="grid grid-cols-5 gap-1 sm:gap-3 max-w-2xl mx-auto">


          </div>


         <p id="game-result"></p>
    
       </section>
    </main>
    <script type="module" src="./main.js"></script>
</body>
</html>
